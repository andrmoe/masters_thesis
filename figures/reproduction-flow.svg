<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="650" viewBox="0 0 1360 650" role="img" aria-labelledby="title desc">
<title id="title">Reproduction workflow and artifact dependencies</title>
<desc id="desc">AI-written diagram. Snelleman extracts study.json. A repair agent consumes the study and produces a Dockerfile and patch. The runner consumes the study, Dockerfile and patch and produces a reproduction record and results. A researcher reviews the study, record and results. Solid arrows mean reads; dashed arrows mean writes.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#172554} .heading{font-size:17px;font-weight:bold} .label{font-size:16px} .file{font-family:monospace;font-size:17px} .small{font-size:13px;fill:#475569} .edge{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)} .write{stroke-dasharray:6 5} </style>
